    <script>
      // Compatibilidad: enlaces antiguos con hash (#/libro/<id>, #/#ancla)
      // se redirigen a su ruta limpia equivalente antes de arrancar la app.
      (function () {
        var h = window.location.hash || ''
        if (h.indexOf('#/') === 0 || /^#libro-/.test(h)) {
          var m = h.match(/^#libro-([a-z0-9]+)/i)
          var path = m ? '/libro/' + m[1] : h.slice(1)
          window.location.replace(path + window.location.search)
        }
      })()
    </script>
